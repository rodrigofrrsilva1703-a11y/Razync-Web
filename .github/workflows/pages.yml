name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "assets/**"
      - "tests/frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate frontend JavaScript
        run: |
          node --check assets/js/workspace-ui.js
          node --check assets/js/date-fields.js
          node --check assets/js/motion.js
          node --check assets/js/app.js
          node --check assets/js/migration.js

      - name: Test reconciliation preview lifecycle
        run: node --test tests/frontend/*.test.cjs

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/
          touch _site/.nojekyll

      - name: Smoke test frontend runtime
        run: |
          rm -rf _smoke
          cp -R _site _smoke
          printf 'window.RAZYNC_CONFIG={apiBase:""};' > _smoke/assets/js/config.js
          python3 -m http.server 4173 --directory _smoke >/tmp/razync-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --enable-logging=stderr --v=1             --virtual-time-budget=8000 --dump-dom http://127.0.0.1:4173/             > /tmp/razync-dom.html 2> /tmp/razync-chrome.log || true
          echo "=== Chrome stderr ==="
          grep -E 'Uncaught|TypeError|ReferenceError|SyntaxError|CONSOLE' /tmp/razync-chrome.log || true
          echo "=== Rendered page checks ==="
          if ! grep -q 'company-row' /tmp/razync-dom.html; then
            echo "Company rows were not rendered. DOM excerpt:"
            grep -n -A8 -B4 'companyGrid' /tmp/razync-dom.html || true
            exit 1
          fi
          grep -q 'id="companyGrid"' /tmp/razync-dom.html
          grep -q 'Razync' /tmp/razync-dom.html
          grep -q 'razync-api-production.up.railway.app' _site/assets/js/config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
