name: Postgres persistence check
on:
  push:
    branches: [main]
    paths: ['backend/**', 'supabase/**', '.github/workflows/postgres-persistence.yml']
  pull_request:
    paths: ['backend/**', 'supabase/**', '.github/workflows/postgres-persistence.yml']
  workflow_dispatch:
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: razync_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d razync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt pytest httpx
      - name: Verify real Postgres cutover, isolation and deduplication
        working-directory: backend
        env:
          RAZYNC_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/razync_test
        run: python -m pytest tests/test_postgres_persistence.py -q --tb=short
