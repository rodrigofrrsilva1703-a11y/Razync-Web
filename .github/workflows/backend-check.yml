name: Backend check

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile API and migrated engine
        run: |
          python -m py_compile backend/app/*.py
          python -m compileall -q backend/legacy/razync
